name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup test database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE linkmeu_test;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d linkmeu_test -f tests/fixtures/ci-schema.sql

      - name: Start backend server
        run: |
          nohup node server.cjs > server.log 2>&1 &
          echo $! > server.pid
          for i in {1..15}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/health || true)
            if [ "$status" = "200" ]; then
              echo "Server is ready"
              break
            fi
            sleep 2
          done
          if [ "$status" != "200" ]; then
            echo "Server failed to start"
            cat server.log
            exit 1
          fi
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/linkmeu_test?sslmode=disable
          JWT_SECRET: test-secret-ci-do-not-use-in-production
          ADMIN_API_KEY: test-admin-key-ci-only
          PORT: 3001
          NODE_ENV: test
          ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173

      - name: Run security regression tests
        run: node tests/security.test.cjs
        env:
          TEST_BASE_URL: http://localhost:3001
          DISABLE_RATE_LIMIT: 'true'

      - name: Run rate-limit threshold test
        run: node tests/rate-limit.test.cjs
        env:
          TEST_BASE_URL: http://localhost:3001

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:3001
          VITE_APP_NAME: LinkMeU
          VITE_APP_VERSION: 1.0.0-ci
          VITE_ENABLE_ANALYTICS: false
          VITE_ENABLE_NOTIFICATIONS: false

      - name: Verify build output exists
        run: test -d dist && echo "Build output verified"

      - name: Print server logs on failure
        if: failure()
        run: cat server.log || true
