name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup test database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE linkmeu_test;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d linkmeu_test -f tests/fixtures/ci-schema.sql

      - name: Start backend server
        run: |
          nohup node server.cjs > server.log 2>&1 &
          echo $! > server.pid
          for i in {1..15}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/health || true)
            if [ "$status" = "200" ]; then
              echo "Server is ready"
              break
            fi
            sleep 2
          done
          if [ "$status" != "200" ]; then
            echo "Server failed to start"
            cat server.log
            exit 1
          fi
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/linkmeu_test?sslmode=disable
          JWT_SECRET: test-secret-ci-do-not-use-in-production
          ADMIN_API_KEY: test-admin-key-ci-only
          PORT: 3001
          NODE_ENV: test
          ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173

      - name: Run security regression tests
        run: node tests/security.test.cjs
        env:
          TEST_BASE_URL: http://localhost:3001
          DISABLE_RATE_LIMIT: 'true'

      - name: Run rate-limit threshold test
        run: node tests/rate-limit.test.cjs
        env:
          TEST_BASE_URL: http://localhost:3001

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:3001
          VITE_APP_NAME: LinkMeU
          VITE_APP_VERSION: 1.0.0-ci
          VITE_ENABLE_ANALYTICS: false
          VITE_ENABLE_NOTIFICATIONS: false

      - name: Verify build output exists
        run: test -d dist && echo "Build output verified"

      - name: Print server logs on failure
        if: failure()
        run: cat server.log || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy-frontend:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-backend:
    runs-on: ubuntu-latest
    needs: test-and-build
    # This job requires the following GitHub repository secrets to be configured:
    #   PROD_HOST    - Production server IP or hostname
    #   PROD_USER    - SSH username (e.g. root)
    #   PROD_SSH_KEY - SSH private key for deployment
    # The job will fail gracefully if secrets are missing, prompting configuration.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy backend to production
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} \
              "set -e; \
               cd /var/www/linkmeu-api; \
               if [ ! -d .git ]; then git init && git remote add origin https://github.com/Adelphos-tech/linkmeu.git; fi; \
               git fetch --depth=1 origin \$COMMIT_SHA; \
               git checkout -f \$COMMIT_SHA; \
               npm ci --production; \
               export GIT_COMMIT=\$COMMIT_SHA; \
               pm2 reload linkmeu --update-env; \
               sleep 5; \
               for i in {1..10}; do \
                 status=\$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/health); \
                 if [ \"\$status\" = '200' ]; then \
                   version=\$(curl -s http://localhost:3000/api/version); \
                   echo \"Health check passed. Version: \$version\"; \
                   exit 0; \
                 fi; \
                 sleep 3; \
               done; \
               echo 'Health check failed after deployment'; \
               exit 1"

      - name: Report deployment
        if: success()
        run: echo "Backend deployed successfully. Commit ${{ github.sha }}"
