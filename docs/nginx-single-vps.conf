# Nginx configuration for single-VPS deployment of LinkMeU
# Place this at: /etc/nginx/sites-available/linkmeu
# Then: sudo ln -s /etc/nginx/sites-available/linkmeu /etc/nginx/sites-enabled/
# Test: sudo nginx -t
# Reload: sudo systemctl reload nginx

server {
    listen 80;
    server_name linkmeu.com www.linkmeu.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name linkmeu.com www.linkmeu.com;

    # SSL certificates (generated by Certbot)
    ssl_certificate /etc/letsencrypt/live/linkmeu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/linkmeu.com/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client body size limit (for image uploads)
    client_max_body_size 10M;

    # Proxy everything to the Express backend
    # The Express server serves static files from STATIC_PATH
    # and falls back to index.html for SPA routing
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Optional: serve uploads directly from disk instead of proxying
    # Uncomment if you want Nginx to serve uploaded files directly
    # location /uploads/ {
    #     alias /var/www/linkmeu-api/uploads/;
    #     expires 1y;
    #     add_header Cache-Control "public, immutable";
    # }
}
